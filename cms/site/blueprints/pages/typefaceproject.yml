title: Typeface Project
icon: headline

options:
  changeStatus: true
  changeSlug: true
  changeTemplate: false
  changeTitle: true
  create: true
  delete: true
  duplicate: true

columns:
  - width: 1/2
    sections:
      home-page-display:
        type: fields
        fields:
          detailPageAvailable:
            label: Detail Page Available
            type: toggle
            default: true
            help: If checked, a link that says 'See full project' will show up under its carousel on the home page and a detail page will be available. If not checked, it will only exist on the home page.
          homePageSize:
            label: Home Page Size
            type: select
            default: medium
            required: true
            help: This will determine how big the project block should be on the home page.
            options:
              small: Small
              medium: Medium
          carouselImages:
            label: Home Carousel Images
            type: files
            layout: cards
            help: These are the images that will appear in the carousels on the home page.
          shortDescription:
            label: Short Description
            type: textarea
            help: This is the short description that will show up under 'More info' on the home page.
  - width: 1/2
    sections:
      page-builder:
        type: fields
        fields:
          fontDueSlug:
            label: FontDue Collection Slug
            type: text
            help: Should be the 'collection slug' for this typeface. This is required in order to pull in the right info from FontDue.
            required: true
          pageContent:
            label: Page Content
            type: blocks
            help: This is the actual content for the typefaces detail page.
            fieldsets:
              image:
                name: Image
                icon: file-image
                label: "{{ image.0.filename }}"
                fields:
                  image:
                    label: Image
                    type: files
                    max: 1
                  caption:
                    label: Caption
                    type: text
                  text:
                    label: Text
                    type: textarea
                    help: If not empty, this text will show up on the right side of the image.
              textSection:
                name: Text Section
                icon: headline
                fields:
                  text:
                    label: Text
                    type: textarea
                  showWeights:
                    label: Show Weights?
                    type: toggle
                    help: If true, the weights of the typeface will be listed in this section.
              typeTester:
                name: Type Tester
                icon: text
                fields:
                  placeholder:
                    label: Placeholder
                    type: textarea
                  alignment:
                    label: Alignment
                    type: select
                    options:
                      left: Left
                      center: Center
                  columns:
                    label: Columns
                    type: number
                    min: 1
                    max: 3
                  fontSize:
                    label: Font Size
                    type: number
                    min: 10
                    max: 300
                    help: A value between 10 and 300
                  defaultWeight:
                    label: Default Weight
                    type: text
                    help: Must match the name of a weight for this typeface.
              characterCarousel:
                name: Character Carousel
                icon: document
                fields:
                  backgroundColor:
                    label: Background Color
                    type: text
                    default: "#FFBE8E"
                    help: Should be a hex code, e.g. '#FFFFFF'
                  slides:
                    label: Slides
                    type: structure
                    fields:
                      character:
                        label: Character
                        type: text
                        required: true
                      description:
                        label: Description
                        type: textarea
                      weight:
                        label: Weight
                        type: text
                        required: true
                        help: Should be the name of a weight in FontDue
              characterGrid:
                name: Character Grid
                icon: text
