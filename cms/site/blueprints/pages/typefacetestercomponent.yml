title: Typeface Tester

options:
  changeStatus: true
  changeSlug: true
  changeTemplate: false
  changeTitle: true
  create: true
  delete: true
  duplicate: true

columns:
  - width: 1/1
    sections:
      page-info:
        type: fields
        fields:
          info:
            label:
            type: info
            text: |
              This component will add a font tester section to the webpage

  - width: 1/2
    sections:
      example-text:
        type: fields
        fields:
          exampleText:
            type: textarea
            label: Example Text
            buttons: false
            size: medium

  - width: 1/2
    sections:
      default-font-options:
        type: fields
        fields:
          fontStyle:
            label: Default Font Style
            type: select
            options: query
            query:
              fetch: page.fontstyle.toStructure
              text: "{{ structureItem.style }}"
              value: "{{ structureItem.weight }}"
          fontAlign:
            label: Default Align
            type: select
            options:
              - Left Align
              - Center Align
          paragraphColumns:
            label: Default Paragraph Columns
            type: select
            options:
              - 1
              - 2
              - 3
          fontSize:
            label: Default Font Size
            type: select
            options:
              - Small
              - Medium
              - Large





