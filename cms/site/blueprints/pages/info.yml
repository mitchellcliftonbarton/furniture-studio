title: Info Page
icon: italic

columns:
  - width: 1/2
    sections:
      text:
        type: fields
        fields:
          introText:
            label: Intro Text
            type: textarea
            size: large
            help: This text will show as the first text on the information page.
          studioInfoItems:
            label: Studio Info Items
            type: structure
            help: These items will show as pieces of text underneath the intro text. 3 maximum
            max: 3
            fields:
              text:
                label: Text
                type: textarea
                size: small
          licensingPdf:
            label: Licensing PDF
            type: files
            max: 1
            help: This should be a pdf file that will be downloadable in the licensing section.
          licensingPdfText:
            label: Licensing PDF Text
            type: text
            help: This text will show up on the download button for the licensing PDF.
          licensingInfoItems:
            label: Licensing Info Items
            type: structure
            help: These items will show as pieces of text underneath the studio info section. 3 maximum
            max: 3
            fields:
              text:
                label: Text
                type: textarea
                size: small
  - width: 1/2
    sections:
      contact:
        type: fields
        fields:
          contactLinks:
            label: Contact Links
            type: structure
            help: These could be social media links, email, etc. They will appear on the right side of the page.
            fields:
              title:
                label: Title
                type: text
              link:
                label: Link
                type: text
              linkText:
                label: Link Text
                type: text
              showInFooter:
                label: Show in Footer?
                type: toggle
                help: If true, this will show in the global footer
          contactText:
            label: Contact Text
            type: textarea
            size: small
            help: This text will appear under the contact links on the right side of the page.
