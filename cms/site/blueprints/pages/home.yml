title: Home Page
icon: home

columns:
  - width: 1/2
    sections:
      projects:
        type: fields
        fields:
          heroCarouselImages:
            type: files
            multiple: true
            layout: cards
            help: These are the images that will appear in the hero carousel on the home page.
            label: Hero Carousel Images
          heroCarouselTitle:
            type: text
            help: This text will overlay on the hero carousel images.
            label: Hero Carousel Title
          heroAutoplayDuration:
            type: number
            help: The amount of time in milliseconds that the hero carousel will autoplay.
            label: Hero Autoplay Duration
            default: 5000
          modules:
            label: Modules
            type: blocks
            fieldsets:
              featuredProject:
                name: Featured Project
                fields:
                  project:
                    type: pages
                    multiple: false
                    query: site.find('BrandProjects', 'TypefaceProjects')
              carousel:
                name: Carousel
                fields:
                  images:
                    type: files
                    multiple: true
                    layout: cards
                  title:
                    type: text
                    help: This text will overlay on the carousel images.
          activeProjects:
            label: Active Projects
            type: pages
            multiple: true
            query: site.find('BrandProjects', 'TypefaceProjects')
