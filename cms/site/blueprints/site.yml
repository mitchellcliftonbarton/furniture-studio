title: Site

sections:
  fields:
    type: fields
    fields:
      myWebhookButton:
        type: button
        label: Build Site
        text: Build Site
        url: https://api.vercel.com/v1/integrations/deploy/prj_ngjvYJBmifi6uYFPAS4YSgmLYHbU/jo6RBzmzxP
        theme: positive
        reload: true # trigger a page refresh on success to display updated data
  pages:
    type: pages
    status: listed
  catalogFooterSection:
    type: fields
    fields:
      catalogFooter:
        type: structure
        label: Catalog Footer
        fields:
          title:
            label: Title
            type: text
          isActive:
            label: Active?
            type: toggle
            default: false
            help: If inactive, the title will say '(Coming Soon)'
          fontDueSlug:
            label: FontDue Slug
            type: text
            help: This should be the slug for the font collection in FontDue
          link:
            label: Link
            type: pages
            help: The page that this item should link to (if active)
            max: 1
            query: site.find('BrandProjects', 'TypefaceProjects')
          inactiveEmoji:
            label: Inactive Emoji
            type: text
            help: This should be an emoji that will show up if the item is inactive.
